<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'CG';font-style:normal;font-weight:300 700;src:url(cormorant-garamond-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:'CG';font-style:normal;font-weight:300 700;src:url(cormorant-garamond-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'CG';font-style:italic;font-weight:300 700;src:url(cormorant-garamond-cyrillic-wght-italic.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:'CG';font-style:italic;font-weight:300 700;src:url(cormorant-garamond-latin-wght-italic.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:200 800;src:url(manrope-cyrillic-wght-normal.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:'Manrope';font-weight:200 800;src:url(manrope-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Marck';src:url(marck-script-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:'Marck';src:url(marck-script-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Delafield';src:url(mrs-saint-delafield-latin-400-normal.woff2) format('woff2')}

@page{size:148mm 210mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:148mm;height:210mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#7a2e3a;color:#f7efe6;font-family:Manrope,sans-serif;overflow:hidden}

.page{position:relative;width:148mm;height:210mm;overflow:hidden;
  background:
    radial-gradient(ellipse 120% 55% at 50% 0%, rgba(201,164,106,.28), transparent 62%),
    radial-gradient(ellipse 90% 40% at 50% 100%, rgba(94,34,48,.9), transparent 70%),
    #7a2e3a;
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:21mm 12mm 0}

.garland{position:absolute;top:0;left:0;width:100%;height:16mm}
.flakes{position:absolute;inset:0;pointer-events:none}

.frame{position:absolute;inset:6mm;border:.3mm solid rgba(201,164,106,.45);border-radius:3mm;pointer-events:none}
.frame::after{content:'';position:absolute;inset:1.2mm;border:.15mm solid rgba(201,164,106,.25);border-radius:2.2mm}

.kicker{display:inline-flex;align-items:center;gap:2.6mm;font:600 2.9mm/1 Manrope;letter-spacing:.22em;text-transform:uppercase;color:#c9a46a;position:relative}
.kicker::before,.kicker::after{content:'✦';font-size:2.4mm}

.script{font-family:Delafield,cursive;font-size:17mm;line-height:1;color:#f3d9b4;margin-top:4mm;position:relative}

h1{font-family:CG,serif;font-style:italic;font-weight:400;font-size:8.2mm;line-height:1.12;color:#f7efe6;margin-top:3mm;max-width:118mm;text-wrap:balance;position:relative}

.rule{display:flex;align-items:center;gap:3mm;color:#c9a46a;font-size:3mm;margin:4.5mm 0 5mm;position:relative}
.rule span{display:block;width:16mm;height:.25mm;background:rgba(201,164,106,.75)}

.card{position:relative;background:#fff;border-radius:5mm;padding:3mm;width:76mm;
  box-shadow:none}
.card img{display:block;width:100%;border-radius:3mm}
.card::before{content:'';position:absolute;inset:-1.8mm;border:.3mm solid rgba(243,217,180,.55);border-radius:6.5mm}

.cta{margin-top:6.5mm;font:600 3mm/1 Manrope;letter-spacing:.2em;text-transform:uppercase;color:#f3d9b4;position:relative;display:flex;align-items:center;gap:2.4mm}
.cta svg{width:4.4mm;height:4.4mm}
.lead{margin-top:3mm;font-size:3.6mm;line-height:1.55;color:rgba(247,239,230,.82);max-width:100mm;position:relative}

.sign{position:absolute;bottom:13mm;left:0;right:0;font-family:Marck,cursive;font-size:5.6mm;color:rgba(243,217,180,.92)}
</style>
</head>
<body>
<div class="page">
  <svg class="garland" viewBox="0 0 960 100" preserveAspectRatio="none">
    <path d="M0 8 Q120 70 240 16 T480 16 T720 16 T960 8" fill="none" stroke="rgba(247,239,230,.4)" stroke-width="2"/>
  </svg>
  <svg class="garland" viewBox="0 0 148 16" style="overflow:visible">
    <!-- огоньки вдоль провода (координаты в мм) -->
    <g>
      <circle cx="9"  cy="4.2" r="1.15" fill="#f3d9b4"/><circle cx="9"  cy="4.2" r="2.6" fill="#ffd27a" opacity=".18"/>
      <circle cx="23" cy="5.6" r="1.15" fill="#ffd27a"/><circle cx="23" cy="5.6" r="2.6" fill="#ffd27a" opacity=".2"/>
      <circle cx="46" cy="4.0" r="1.15" fill="#f3d9b4"/><circle cx="46" cy="4.0" r="2.6" fill="#ffd27a" opacity=".18"/>
      <circle cx="60" cy="2.6" r="1.15" fill="#ffd27a"/><circle cx="60" cy="2.6" r="2.6" fill="#ffd27a" opacity=".2"/>
      <circle cx="83" cy="4.0" r="1.15" fill="#f3d9b4"/><circle cx="83" cy="4.0" r="2.6" fill="#ffd27a" opacity=".18"/>
      <circle cx="97" cy="2.6" r="1.15" fill="#ffd27a"/><circle cx="97" cy="2.6" r="2.6" fill="#ffd27a" opacity=".2"/>
      <circle cx="120" cy="4.0" r="1.15" fill="#f3d9b4"/><circle cx="120" cy="4.0" r="2.6" fill="#ffd27a" opacity=".18"/>
      <circle cx="136" cy="2.6" r="1.15" fill="#ffd27a"/><circle cx="136" cy="2.6" r="2.6" fill="#ffd27a" opacity=".2"/>
    </g>
  </svg>

  <!-- снег и звёздочки -->
  <svg class="flakes" viewBox="0 0 148 210">
    <g fill="#f7efe6">
      <circle cx="14" cy="30" r=".6" opacity=".55"/><circle cx="133" cy="26" r=".7" opacity=".5"/>
      <circle cx="20" cy="58" r=".5" opacity=".45"/><circle cx="128" cy="64" r=".6" opacity=".5"/>
      <circle cx="12" cy="96" r=".7" opacity=".4"/><circle cx="137" cy="104" r=".5" opacity=".45"/>
      <circle cx="17" cy="140" r=".6" opacity=".4"/><circle cx="131" cy="146" r=".7" opacity=".4"/>
      <circle cx="14" cy="184" r=".5" opacity=".4"/><circle cx="135" cy="188" r=".6" opacity=".45"/>
      <circle cx="38" cy="40" r=".4" opacity=".35"/><circle cx="111" cy="44" r=".45" opacity=".35"/>
      <circle cx="30" cy="118" r=".4" opacity=".3"/><circle cx="119" cy="124" r=".4" opacity=".3"/>
      
    </g>
    <g fill="#c9a46a">
      <path d="M24 78 l.7 2 2 .7 -2 .7 -.7 2 -.7 -2 -2 -.7 2 -.7z" opacity=".85"/>
      <path d="M126 86 l.55 1.6 1.6 .55 -1.6 .55 -.55 1.6 -.55 -1.6 -1.6 -.55 1.6 -.55z" opacity=".75"/>
      <path d="M18 160 l.55 1.6 1.6 .55 -1.6 .55 -.55 1.6 -.55 -1.6 -1.6 -.55 1.6 -.55z" opacity=".7"/>
      <path d="M130 158 l.7 2 2 .7 -2 .7 -.7 2 -.7 -2 -2 -.7 2 -.7z" opacity=".8"/>
    </g>
  </svg>

  <div class="frame"></div>

  <p class="kicker">с наступающим</p>
  <p class="script" lang="en">Christmas mood</p>
  <h1>кажется, декабрь приготовил для тебя кое-что особенное…</h1>

  <div class="rule"><span></span>✦<span></span></div>

  <div class="card"><img src="qr.png" alt=""></div>

  <p class="cta">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    наведи камеру — открой послание
  </p>
  <p class="lead">тебя ждёт личное декабрьское послание и&nbsp;бесплатный гайд, чтобы провести декабрь в&nbsp;контакте с&nbsp;собой</p>

  <p class="sign">маленькое зимнее чудо от missmalofii</p>
</div>
</body>
</html>
